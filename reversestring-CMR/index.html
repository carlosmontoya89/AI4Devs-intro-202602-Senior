<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse String Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; padding: 50px; }
        .container { max-width: 600px; }
        #resultArea { margin-top: 20px; font-size: 1.2rem; min-height: 30px; }
        .btn-copy { background-color: #6b7280; color: white; }
        .btn-copy:hover { background-color: #4b5563; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="fw-bold mb-4">Reverse String</h1>
    
    <div class="mb-3">
        <input type="text" id="userInput" class="form-control form-control-lg" placeholder="Hello, welcome to AI4Devs">
    </div>

    <div id="resultArea" class="mt-4"></div>

    <button id="copyBtn" class="btn btn-copy mt-2 d-none">
        Copy 📋
    </button>
</div>

<script src="script.js"></script>
</body>
</html>
